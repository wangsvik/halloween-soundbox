<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soundbox">
  <title>Halloween Soundbox</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">🎃</span>
      <h1>Soundbox</h1>
    </div>
    <div class="top-actions">
      <span id="conn" class="conn" title="Tilkobling">frakoblet</span>
      <a href="manage.html" class="top-link">＋ Lyder</a>
    </div>
  </header>

  <main>
    <section class="now" aria-live="polite">
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="now-text">
        <small>Spiller nå</small>
        <strong id="now">Stille …</strong>
      </div>
    </section>

    <section class="card">
      <label class="row" for="volume">
        <span>Volum</span>
        <output id="volume-out">70 %</output>
      </label>
      <input id="volume" type="range" min="0" max="100" step="1" value="70">
    </section>

    <section class="card">
      <div class="row">
        <h2>Bakgrunnsambiens</h2>
        <button id="ambient-toggle" class="switch" role="switch" aria-checked="false">
          <span class="knob"></span><span class="sr">Ambiens av/på</span>
        </button>
      </div>
      <div id="ambient-list" class="chips"></div>
    </section>

    <section class="card random">
      <select id="random-cat" aria-label="Kategori for tilfeldig lyd">
        <option value="">Alle kategorier</option>
      </select>
      <button id="random" class="btn-random">🎲 Tilfeldig lyd</button>
    </section>

    <div id="effects"></div>
    <p id="empty" class="empty" hidden>Ingen lyder ennå. <a href="manage.html">Last opp lyder her</a>.</p>
  </main>

  <footer class="stopbar">
    <button id="stop" class="btn-stop">■ STOPP ALT</button>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
